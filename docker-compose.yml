# ──────────────────────────────────────────────────────────────
# docker-compose.yml — 한끼팟 전체 서비스 실행
# 실행 명령어: docker compose up -d --build
# ──────────────────────────────────────────────────────────────

services:

  # ── MySQL 8.0 ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: hankkipot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # 3307로 매핑: 로컬에 MySQL이 깔려있어도 포트 충돌 방지
      - "3307:3306"
    volumes:
      # Named Volume: 컨테이너 삭제해도 DB 데이터 유지
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # MySQL이 완전히 준비됐는지 10초마다 확인
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hankkipot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly yes       # 재시작해도 데이터 유지
      - --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Kafka (KRaft 모드) ────────────────────────────────────────
  # ZooKeeper 없이 Kafka 자체 Raft 메타데이터 쿼럼으로 실행
  # 채팅 메시지 분배 + 알림 이벤트 발행/구독 메시지 브로커
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: hankkipot-kafka
    ports:
      # 외부(로컬 개발 환경)에서 접근할 때 사용
      - "9092:9092"
    environment:
      # KRaft 단일 노드 설정
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # PLAINTEXT: 컨테이너 내부 앱 통신 (29092)
      # PLAINTEXT_HOST: 외부 로컬 개발 통신 (9092)
      # CONTROLLER: KRaft 컨트롤러 내부 통신 (29093)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 단일 브로커 개발 환경 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 토픽 자동 생성 활성화 (개발 편의)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

      # Confluent KRaft 클러스터 식별자
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── PostgreSQL + pgvector (RAG 전용) ────────────────────────────
  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: hankkipot-rag-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Spring Boot 앱 ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hankkipot-app
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # prod 프로파일 활성화 → application-prod.yml 로드
      SPRING_PROFILES_ACTIVE: prod

      # DB — "localhost"가 아닌 서비스 이름 "mysql"로 접근
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      # Redis — 서비스 이름 "redis"로 접근
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Kafka — 컨테이너 내부 통신은 29092 포트 사용
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # 이하 .env 파일에서 값을 읽어서 컨테이너에 전달
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_SIGNUP_TOKEN_VALIDITY_TIME: ${JWT_SIGNUP_TOKEN_VALIDITY_TIME}
      JWT_ACCESS_TOKEN_VALIDITY_TIME: ${JWT_ACCESS_TOKEN_VALIDITY_TIME}
      JWT_REFRESH_TOKEN_VALIDITY_TIME: ${JWT_REFRESH_TOKEN_VALIDITY_TIME}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      ADMIN_INIT_EMAIL: ${ADMIN_INIT_EMAIL}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
      ADMIN_INIT_NAME: ${ADMIN_INIT_NAME}

      GEMINI_KEY: ${GEMINI_KEY}
      OPEN_AI_KEY: ${OPEN_AI_KEY}

    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: always

  # ── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - prometheus

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    # frontend 폴더의 Dockerfile로 이미지 빌드
    build:
      context: ./frontend
      dockerfile: Dockerfile

    # 호스트 5173 → 컨테이너 5173 포트 연결
    ports:
      - "5173:5173"

    # 소스코드 변경 시 컨테이너에 실시간 반영 (핫리로드)
    volumes:
      - ./frontend:/app
      - /app/node_modules  # node_modules는 컨테이너 것 사용

    # 환경변수 설정 (백엔드 API 주소)
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_PORTONE_STORE_ID=${PORTONE_STORE_ID}
      - VITE_PORTONE_CHANNEL_KEY=${PORTONE_CHANNEL_KEY}

    # 백엔드 앱이 뜬 후에 프론트 실행
    depends_on:
      - app

    restart: always

# ── 볼륨 정의 ─────────────────────────────────────────────────
volumes:
  mysql_data:
  redis_data:
  rag_postgres_data:
