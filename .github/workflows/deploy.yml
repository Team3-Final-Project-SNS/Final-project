# main 브랜치에 push될 때 자동으로 EC2에 배포
name: Deploy to EC2

on:
  push:
    branches: [ main ]  # main 브랜치 push 시 실행

jobs:
  deploy:
    runs-on: ubuntu-latest  # GitHub 제공 우분투 서버에서 실행

    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Java 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. JAR 빌드 (테스트 스킵)
      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      # 5. EC2로 JAR 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/"

      # 6. EC2에서 앱 재시작
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 실행 중인 앱 종료
            pkill -f 'java -jar' || true
            
            # JAR 파일 이름 통일
            mv /home/ec2-user/build/libs/*.jar /home/ec2-user/app.jar
            
            # 백그라운드로 앱 실행, 로그는 app.log에 기록
            nohup java -jar /home/ec2-user/app.jar \
              --spring.profiles.active=prod \
              > /home/ec2-user/app.log 2>&1 &