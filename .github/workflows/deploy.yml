name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/app"

      - name: Deploy with Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/app

            if [ ! -f .env ]; then
              echo ".env file is missing on EC2: /home/ec2-user/app/.env"
              exit 1
            fi

            set -a
            . ./.env
            set +a

            export SPRING_PROFILES_ACTIVE_DOCKER=prod

            export MYSQL_ROOT_PASSWORD_LOCAL="${MYSQL_ROOT_PASSWORD_PROD}"
            export MYSQL_DATABASE_LOCAL="${MYSQL_DATABASE_PROD}"
            export MYSQL_USER_LOCAL="${MYSQL_USER_PROD}"
            export MYSQL_PASSWORD_LOCAL="${MYSQL_PASSWORD_PROD}"

            export REDIS_PASSWORD_LOCAL="${REDIS_PASSWORD_PROD}"

            export VITE_API_BASE_URL_LOCAL="${VITE_API_BASE_URL_PROD}"

            docker-compose down
            docker-compose up --build -d
            docker-compose ps
