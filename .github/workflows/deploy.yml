name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 이전 빌드 잔여물(src, build) 정리
      # compileJava 캐시 충돌 방지를 위해 파일 복사 전에 실행
      - name: Clean old build artifacts on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf /home/ec2-user/app/src
            rm -rf /home/ec2-user/app/build

      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/app"

      - name: Deploy with Blue-Green script on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/app

            if [ ! -f .env ]; then
              echo ".env file is missing on EC2: /home/ec2-user/app/.env"
              exit 1
            fi

            if [ ! -f frontend/.env.local ]; then
              echo "frontend/.env.local file is missing on EC2: /home/ec2-user/app/frontend/.env.local"
              exit 1
            fi

            # ---- 1. app-blue / app-green 무중단 전환 배포 ----
            # 현재 비활성 환경(blue/green)에 새 코드를 빌드하고,
            # 헬스체크 통과 후 ALB 트래픽을 전환, 이전 환경을 종료함
            chmod +x deploy-blue-green.sh
            ./deploy-blue-green.sh

            # ---- 2. 나머지 서비스(frontend, 모니터링 등) 갱신 ----
            # app-blue/app-green은 위 스크립트가 이미 처리했으므로
            # 여기서는 나머지 서비스만 재빌드/재시작
            # (app-blue, app-green은 上記 스크립트가 상태를 관리하므로 제외)
            docker-compose -f docker-compose.prod.yml up --build -d \
              frontend prometheus loki alloy grafana n8n

            docker-compose -f docker-compose.prod.yml ps