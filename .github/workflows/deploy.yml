# 수동으로 배포할 때만 EC2에 Docker Compose 배포
name: Deploy to EC2

on:
  workflow_dispatch:  # GitHub Actions 탭에서 Run workflow 버튼으로 수동 실행

jobs:
  deploy:
    runs-on: ubuntu-latest  # GitHub 제공 우분투 서버에서 실행

    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 프로젝트 파일 전체를 EC2로 전송
      # .env 파일은 EC2에 이미 올려져 있으므로 제외
      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/app"
          exclude: ".env,.git,*.pem"

      # 3. EC2에서 Docker Compose 실행
      - name: Deploy with Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app

            # 기존 컨테이너 종료
            docker-compose down

            # 새 이미지 빌드 후 백그라운드 실행
            docker-compose up --build -d

            # 실행 중인 컨테이너 확인
            docker-compose ps