global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "spring-boot-app"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "host.docker.internal:8080"
        labels:
          color: "blue"
      - targets:
          - "host.docker.internal:8081"
        labels:
          color: "green"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
