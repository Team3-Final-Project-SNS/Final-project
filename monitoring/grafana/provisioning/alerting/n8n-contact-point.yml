apiVersion: 1

contactPoints:
  - orgId: 1
    name: n8n-webhook
    receivers:
      - uid: n8n-webhook
        type: webhook
        settings:
          url: ${GRAFANA_N8N_WEBHOOK_URL}
          httpMethod: POST
          maxAlerts: "10"
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: n8n-webhook
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
